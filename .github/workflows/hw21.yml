name: HW21 Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - HW21
      - master

jobs:
  hw21-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install
        working-directory: ./QA/HW21

      - name: Build app
        run: npm run build   # если нужен build
        working-directory: ./QA/HW21

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ./QA/HW21

      - name: Run HW21 tests
        run: npx playwright test
        working-directory: ./QA/HW21
