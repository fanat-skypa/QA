name: HW21 Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - HW21
      - master

jobs:
  hw21:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Start app
        run: npm start &
      
      - name: Wait for app
        run: |
          for i in {1..20}; do
            curl http://localhost:3000 && break
            sleep 3
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run HW21 tests
        run: npx playwright test HW21
