name: Test
on:
  workflow_dispatch:
  pull_request:
    branches:
      - HW21
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run application locally
        run: |
          npm start & 

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run HW21 tests
        run: npx playwright test --grep HW21